version: 1
name: no-secure-boot-write
description: Secure boot databases are read only over Redfish, keys can only be reset. Enrollment happens from the guest.

secure_boot:
  database_write: false
  database_write_error: {status: 405, message_id: Base.1.18.ActionNotSupported}   # TODO verify against a recording
  reset_keys:
    supported: true
    types: [DeleteAllKeys, DeletePK]
    response: "200"                 # like Lenovo XCC
    applies: on_reset               # like Lenovo XCC and HPE iLO 5

power:
  response: 200-error               # like HPE iLO 5

responses:
  patch: "200"                      # like Dell iDRAC 9
