version: 1
name: test-pending
description: BIOS attributes are staged on a separate settings object and applied on the next reset.

bios:
  task_resource: true
  settings_object: true
  pending: true
  apply_time:
    supported: [OnReset, Immediate]
  patch_requires_power_off: false
  registry:
    id: TestBiosAttributeRegistry.v1_0_0
    attributes:
      - {name: Mode, type: Enumeration, values: [Standard, Performance], default: Standard}
      - name: SecureBootControl
        type: Enumeration
        values: [Enabled, Disabled]
        default: Enabled
        maps_to: security.secureboot
        value_map: {Enabled: "true", Disabled: "false"}
