version: 1
name: test-power
description: Resets answer with a task after a delay, writes are refused after a power on, the boot override may be Once.

virtual_media:
  boot_override_once: true

power:
  reset_types: [On, ForceOff, ForceRestart]
  response: 202-task
  not_settled_window: 20s
  delay: 1s

timing:
  scale: 0.01
