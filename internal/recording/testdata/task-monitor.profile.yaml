# Draft profile from a BMC recording. Review every value and resolve each TODO verify.
# Recording 20261109T122950Z, made by Operations Center 0.11.0.
# Recorded with server model Example Server 4, BMC firmware 7.00, BIOS 2.27.0.
version: 1
name: draft
description: "Draft from a BMC recording of server model Example Server 4, BMC firmware 7.00, BIOS 2.27.0."

bios:
  patch_response: 202-taskmonitor   # seq 7, 9; the task URI answers like a task monitor, without a task body
  task_resource: false              # no evidence; no GET answered a task resource
  settings_object: true             # seq 7
  pending: true                     # seq 2; TODO verify; a settings object holds the future settings
  apply_time:
    supported: [OnReset]            # seq 2; TODO verify; dropped AtMaintenanceWindowStart, InMaintenanceWindowOnReset, the proxy knows only Immediate and OnReset
    default: OnReset                # seq 7; as asked for by Operations Center
  patch_requires_power_off: true    # no evidence; BIOS PATCHes sent only while the server was off
  registry:
    id: DraftBiosAttributeRegistry.v1_0_0 # seq 4, 7, 14; vendor registry IDs are not copied
    attributes:
      - {name: DraftEnumeration, type: Enumeration, values: ["Enabled", "Disabled"]} # seq 4, 7; vendor attributes SecureBoot
      - {name: DraftRequirement, type: Enumeration, values: ["Standard", "Performance"], default: "Standard"} # seq 4, 14; TODO verify; stands for the attribute the deferred ones depend on
      - {name: DraftDeferred, type: Enumeration, values: ["SHA1", "SHA256"], requires: {attribute: DraftRequirement, value: Performance}} # seq 4, 14; TODO verify; vendor attributes Tpm2Algorithm
  errors:
    unknown_attribute: {status: 400, message_id: Base.1.18.PropertyUnknown} # no evidence; no write to an unknown attribute was recorded
    deferred_rejected: {status: 400, message_id: Base.1.18.PropertyUnknown} # no evidence; no deferred attribute was refused

secure_boot:
  database_write: true              # seq 18
  database_write_error: {status: 405, message_id: Base.1.18.ActionNotSupported} # no evidence; no database write was refused
  database_add_response: "204"      # seq 18
  database_delete_response: "200-error" # seq 17; IDRAC.2.8.SYS430
  reset_keys:
    supported: false                # no evidence
    types: [DeleteAllKeys, DeletePK] # no evidence
    response: "204"                 # no evidence
    applies: immediately            # no evidence
    disables_secure_boot: false     # no evidence; Operations Center sent no ResetKeys
    unreachable:
      after: 0s                     # no evidence; Operations Center sent no ResetKeys
      for: 0s                       # no evidence; Operations Center sent no ResetKeys
  certificate_id_style: sequential  # seq 15, 16, 19, 20
  certificate_id_prefix: "CustPolicy." # seq 15, 16, 19, 20
  enable_requires_power_off: true   # no evidence; Operations Center did not change SecureBootEnable
  power_cycle:
    after: []                       # no evidence; Operations Center changed no secure boot setting
    off_after: 0s                   # no evidence; Operations Center changed no secure boot setting
    off_for: 0s                     # no evidence; Operations Center changed no secure boot setting
  empty_after_power_on:
    times: 0                        # seq 18; no key database read empty after a power on
    for: 0s                         # no evidence; no key database read empty after a power on

virtual_media:
  insert: standard                  # no evidence
  oem_vendor: Incus                 # proxy setting, never a real vendor
  oem_action: InsertVirtualMedia    # no evidence
  insert_response: "204"            # no evidence
  boot_override_once: true          # seq 21; accepted in a PATCH, no allowable values published
  refused_parameters:
    names: []                       # no evidence; Operations Center inserted no media
    error: {status: 400, message_id: Base.1.18.ActionParameterUnknown} # no evidence; Operations Center inserted no media
  locations: [managers]             # no evidence; the system and the manager were not read
  id: "CD"                          # no evidence; Operations Center inserted no media
  delivery: full-fetch              # no evidence; TODO verify; range requests against the media URL are not recorded
  stream:
    read_ahead: 4MiB                # proxy setting
    cache: 64MiB                    # proxy setting
    fallback: full-fetch            # proxy setting

power:
  reset_types: []                   # no evidence
  response: "204"                   # seq 8
  not_settled_window: 0s            # no evidence; no write was refused after a power on
  not_settled_error: {status: 400, message_id: Base.1.18.ResourceInStandby} # no evidence; no write was refused after a power on
  delay: {on: 0s, off: 0s}          # seq 8, 11, 12, 13; TODO verify; the power state became On 0s to 21s and Off 0s to 9s after the reset, bounded by the polls
  redundant_reset_errors:
    off: {status: 409, message_id: IDRAC.2.8.PSU502} # seq 1, 5; refused ForceOff while Off
    on: null                        # no evidence; Operations Center sent no reset to the current power state
  busy_reads:
    resources: []                   # no evidence; no read was refused until a retry succeeded
    failures: 0                     # no evidence; no read was refused until a retry succeeded
    error: {status: 503, message_id: Base.1.18.ServiceTemporarilyUnavailable} # no evidence; no read was refused until a retry succeeded

responses:
  patch: "200"                      # seq 21; Base.1.12.Success

timing:
  scale: 1.0                        # proxy setting
