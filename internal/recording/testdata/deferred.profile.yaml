version: 1
name: draft
description: "Draft from a BMC recording of server model Example Server 1, BMC firmware 1.30.20, BIOS 2.4.1."

bios:
  patch_response: 202-taskmonitor   # seq 4
  task_resource: false              # no evidence; no GET answered a task resource
  settings_object: true             # seq 4
  pending: true                     # seq 4, 5
  apply_time:
    supported: [OnReset, Immediate] # seq 2; TODO verify; dropped AtMaintenanceWindowStart, the proxy knows only Immediate and OnReset
    default: OnReset                # seq 4; as asked for by Operations Center
  patch_requires_power_off: false   # seq 1, 4
  registry:
    id: DraftBiosAttributeRegistry.v1_0_0 # seq 3, 4, 8; vendor registry IDs are not copied
    attributes:
      - {name: DraftEnumeration, type: Enumeration, values: ["Standard", "Performance"]} # seq 3, 4; vendor attributes Mode
      - {name: DraftInteger, type: Integer, min: 0, max: 100} # seq 3, 4; vendor attributes Threshold
      - {name: DraftRequirement, type: Enumeration, values: ["Standard", "Performance"], default: "Standard"} # seq 3, 8; TODO verify; stands for the attribute the deferred ones depend on
      - {name: DraftDeferred, type: Enumeration, values: ["Enabled", "Disabled"], requires: {attribute: DraftRequirement, value: Performance}} # seq 3, 8; TODO verify; vendor attributes ModeOption
  errors:
    unknown_attribute: {status: 400, message_id: Base.1.18.PropertyUnknown} # no evidence; no write to an unknown attribute was recorded
    deferred_rejected: {status: 400, message_id: Base.1.12.PropertyUnknown} # seq 6

secure_boot:
